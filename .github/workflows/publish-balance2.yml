name: Publish Balance 2 ZPK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-balance2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download current Balance 2 ZPK
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/avvnsk-collab/watchfacenew/main/release/amg_petronas_Balance_2.zpk' \
            -o AMG_Petronas_Balance_2.zpk
          test -s AMG_Petronas_Balance_2.zpk
          sha1sum AMG_Petronas_Balance_2.zpk

      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AMG_Petronas_Balance_2.zpk
          if git diff --cached --quiet; then
            echo 'No changes to publish'
          else
            git commit -m 'Publish AMG Petronas Balance 2 ZPK'
            git push origin HEAD:main
          fi
