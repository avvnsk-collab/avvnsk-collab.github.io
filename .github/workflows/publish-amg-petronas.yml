name: Publish AMG Petronas Balance 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-amg-petronas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download last known working ZPK
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/avvnsk-collab/watchfacenew/dd12e11c15c741e352860156d3c494816ae764f1/release/1_ac99199866d00c4fd553230af4bb9953.zpk' \
            -o AMG_Petronas_Balance_2.zpk
          test -s AMG_Petronas_Balance_2.zpk
          sha1sum AMG_Petronas_Balance_2.zpk

      - name: Publish to GitHub Pages repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AMG_Petronas_Balance_2.zpk
          if git diff --cached --quiet; then
            echo 'File already published'
          else
            git commit -m 'Publish AMG Petronas Balance 2 working ZPK'
            git push origin HEAD:main
          fi
